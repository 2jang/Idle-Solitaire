<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추천기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .numbers {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            min-height: 60px;
            flex-wrap: wrap;
        }

        .ball {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.3em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: pop 0.4s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .ball-1-10 { background: #fbc400; }
        .ball-11-20 { background: #69c8f2; }
        .ball-21-30 { background: #ff7272; }
        .ball-31-40 { background: #aaa; }
        .ball-41-45 { background: #b0d840; }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .placeholder {
            color: #ccc;
            font-size: 1.1em;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 로또 번호 추천기</h1>
        <p class="subtitle">버튼을 눌러 행운의 번호를 받아보세요!</p>
        <div class="numbers" id="numbers">
            <p class="placeholder">아직 번호가 없습니다</p>
        </div>
        <button onclick="generateNumbers()">번호 추천받기</button>
    </div>

    <script>
        function getBallClass(num) {
            if (num <= 10) return 'ball-1-10';
            if (num <= 20) return 'ball-11-20';
            if (num <= 30) return 'ball-21-30';
            if (num <= 40) return 'ball-31-40';
            return 'ball-41-45';
        }

        function generateNumbers() {
            const numbers = new Set();
            while (numbers.size < 6) {
                numbers.add(Math.floor(Math.random() * 45) + 1);
            }
            const sorted = [...numbers].sort((a, b) => a - b);

            const container = document.getElementById('numbers');
            container.innerHTML = '';
            sorted.forEach((num, idx) => {
                const ball = document.createElement('div');
                ball.className = `ball ${getBallClass(num)}`;
                ball.textContent = num;
                ball.style.animationDelay = `${idx * 0.1}s`;
                container.appendChild(ball);
            });
        }
    </script>
</body>
</html>
